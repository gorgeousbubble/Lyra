<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1090" width="1500" height="1090">
  <style>
    .ttl{font:600 24px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#111827}
    .sub{font:13px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#6b7280}
    .warn{font:12px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#b45309}
    .blk{fill:#fbfcfe;stroke:#334155;stroke-width:1.6}
    .btitle{font:600 13.5px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#0f172a}
    .bmeta{font:11px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#64748b}
    .pin{font:11.5px Consolas,ui-monospace,monospace;fill:#1e293b}
    .pinsm{font:10.5px Consolas,ui-monospace,monospace;fill:#475569}
    .amber{font:10.5px Consolas,ui-monospace,monospace;fill:#b45309}
    .grp{font:10.5px Consolas,ui-monospace,monospace;fill:#334155}
    .note{font:11.5px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#334155}
    .foot{font:11.5px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#475569}
    .lg{font:11px 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#475569}
    .w{stroke-width:1.6;fill:none}
    .bus{stroke-width:5;fill:none;stroke-linecap:round}
    .cPAR{stroke:#7c3aed}
    .cSPI{stroke:#2563eb}
    .cI2C{stroke:#059669}
    .cGPIO{stroke:#64748b}
    .cAN{stroke:#ea580c}
  </style>

  <rect width="1500" height="1090" fill="#ffffff"/>

  <text class="ttl" x="750" y="42" text-anchor="middle">Lyra — 系统互连原理图（由固件反推）</text>
  <text class="sub" x="750" y="66" text-anchor="middle">NXP MAPS-K64 主板 + MAPS-DOCK 扩展板 + 外接传感器模块 · 全部引脚取自 app/ board/ chip/ dev/ 源码</text>
  <text class="warn" x="750" y="87" text-anchor="middle">这是连接关系图，不是可投产原理图：不含电源树、去耦、限流/驱动、晶振负载电容 —— 固件中不存在这些信息</text>

  <!-- MCU -->
  <rect class="blk" x="600" y="150" width="300" height="872" rx="6" fill="#eef2f7"/>
  <text class="btitle" x="750" y="180" text-anchor="middle" font-size="15">MK64FX512VLQ12</text>
  <text class="bmeta" x="750" y="200" text-anchor="middle">144-LQFP · Cortex-M4F + FPU</text>
  <text class="bmeta" x="750" y="217" text-anchor="middle">Core 100 / Bus 50 / FlexBus 25 / Flash 25 MHz</text>
  <text class="bmeta" x="750" y="234" text-anchor="middle">PLL100 ← 50 MHz XTAL (PRDIV 24, VDIV 26)</text>
  <line x1="620" y1="248" x2="880" y2="248" stroke="#cbd5e1" stroke-width="1"/>

  <text class="grp" x="612" y="300">PORTB/C/D</text>
  <text class="grp" x="612" y="315">FlexBus</text>
  <text class="grp" x="612" y="500">PORTD</text>
  <text class="grp" x="612" y="515">SPI2 (DSPI)</text>
  <text class="grp" x="612" y="762">OSC / SWD</text>

  <text class="grp" x="888" y="200" text-anchor="end">PTA28/29</text>
  <text class="grp" x="888" y="330" text-anchor="end">PTE10/11</text>
  <text class="grp" x="888" y="345" text-anchor="end">PTA7/PTA10</text>
  <text class="grp" x="888" y="497" text-anchor="end">PTE26/28</text>
  <text class="grp" x="888" y="607" text-anchor="end">PTE7</text>
  <text class="grp" x="888" y="717" text-anchor="end">PORTA/PORTB</text>
  <text class="grp" x="888" y="836" text-anchor="end">PTB4-7</text>
  <text class="grp" x="888" y="945" text-anchor="end">PTC14/15</text>
  <text class="grp" x="888" y="960" text-anchor="end">ADC0</text>

  <!-- ILI9341 -->
  <rect class="blk" x="60" y="150" width="430" height="162" rx="6"/>
  <text class="btitle" x="76" y="172">ILI9341 TFT-LCD　320 × 240　RGB565</text>
  <text class="bmeta" x="76" y="190">MAPS-DOCK 板载 · 8080 并口 16-bit 只写 · FlexBus CS0</text>
  <text class="pin" x="76" y="212">FB_AD[20:0]  PTD6-2 · PTC10-4,2-0 · PTB18-16,11-9</text>
  <text class="pin" x="76" y="231">FB_ALE  PTD0    FB_CS0  PTD1    FB_CLK  PTC3</text>
  <text class="pin" x="76" y="250">FB_R/W  PTC11   FB_OE   PTB19</text>
  <text class="pin" x="76" y="269">FB_BE23_16  PTC16   FB_BE31_24  PTC17</text>
  <text class="pinsm" x="76" y="288">D/C = FlexBus A1 → 0x6000_0000 命令 / 0x6000_0002 数据</text>
  <text class="pinsm" x="76" y="304">背光 PTD9 已定义但固件从未驱动（拓扑未知）</text>
  <path class="bus cPAR" d="M490 234 H600"/>
  <path class="w cPAR" d="M538 244 l16 -20"/>
  <text class="pinsm" x="546" y="218" fill="#7c3aed">29</text>

  <!-- SRAM -->
  <rect class="blk" x="60" y="336" width="430" height="92" rx="6"/>
  <text class="btitle" x="76" y="358">外部 SRAM（型号未知）</text>
  <text class="bmeta" x="76" y="376">MAPS-K64 板载 · 与 LCD 共用 FB_AD 总线</text>
  <text class="pin" x="76" y="398">FB_CS2  PTC18　@ 0x8000_0000　16-bit　BEM=1</text>
  <text class="pinsm" x="76" y="417">固件配置了窗口与时序，但应用层从未访问</text>
  <path class="w cPAR" d="M490 392 H570 V234"/>

  <!-- LCM -->
  <rect class="blk" x="60" y="452" width="430" height="112" rx="6"/>
  <text class="btitle" x="76" y="474">ST7565R / Manley ZYMG12864　128 × 64 LCM</text>
  <text class="bmeta" x="76" y="492">MAPS-DOCK 板载 · DSPI 主模式 10 Mbps</text>
  <text class="pin" x="76" y="514">SCK  PTD12    MOSI  PTD13    (MISO  PTD14)</text>
  <text class="pin" x="76" y="533">CS  PTD15 = SPI2_PCS1      D/C  PTD10 (GPIO)</text>
  <text class="pinsm" x="76" y="552">注意 PTD15 同时被注释为板载外部中断线（未使用）</text>
  <path class="bus cSPI" d="M490 514 H600"/>

  <!-- W25Q80 -->
  <rect class="blk" x="60" y="588" width="430" height="104" rx="6"/>
  <text class="btitle" x="76" y="610">W25Q80 SPI NOR Flash　1 MB</text>
  <text class="bmeta" x="76" y="628">MAPS-DOCK 板载 · 存放配置（闹钟、步数目标、各类阈值）</text>
  <text class="pin" x="76" y="650">共用 SPI2：SCK PTD12 · MOSI PTD13 · MISO PTD14</text>
  <text class="pin" x="76" y="669">CS  PTD11 = SPI2_PCS0　（随 LCM 一起跑在 10 MHz）</text>
  <path class="bus cSPI" d="M490 650 H560 V514"/>

  <!-- clocks -->
  <rect class="blk" x="60" y="716" width="430" height="132" rx="6"/>
  <text class="btitle" x="76" y="738">时钟源与调试口</text>
  <text class="pin" x="76" y="760">EXTAL / XTAL　　　50 MHz　→ MCG PLL</text>
  <text class="pin" x="76" y="779">EXTAL32 / XTAL32　32.768 kHz → RTC（片内 16 pF 负载电容）</text>
  <text class="pin" x="76" y="798">SWD / JTAG　　　　PTA0-PTA3　+　RESET_b</text>
  <text class="pinsm" x="76" y="820">50 MHz 是无源晶体还是有源晶振，固件无法判断</text>
  <text class="pinsm" x="76" y="836">看门狗在 startup/src/system_init.c 中被关闭</text>
  <path class="w cAN" d="M490 762 H600"/>
  <path class="w cAN" d="M490 798 H565 V762"/>

  <!-- power unknown -->
  <rect x="60" y="872" width="430" height="150" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="btitle" x="76" y="894" fill="#92400e">电源域 —— 固件中无任何信息</text>
  <text class="note" x="76" y="916">唯一可确认电压：ADC_VREF_MV = 3300 → 3.3 V 模拟参考</text>
  <text class="note" x="76" y="936">未知：稳压器拓扑、5 V / 3.3 V 来源、去耦网络</text>
  <text class="note" x="76" y="956">未知：是否有电池 / 充电管理 / VBAT 备份域</text>
  <text class="note" x="76" y="976">未知：背光驱动限流、蜂鸣器驱动管、LED 限流电阻</text>
  <text class="note" x="76" y="996">未知：三条软件 I2C 的上拉电阻（硬件上必须外加）</text>
  <text class="note" x="76" y="1014">未知：VREFH / VREFL 接法、连接器与排针映射</text>

  <!-- MPU6050 -->
  <rect class="blk" x="1010" y="150" width="430" height="104" rx="6"/>
  <text class="btitle" x="1026" y="172">MPU6050　6 轴 IMU　0x68 (AD0=0)</text>
  <text class="bmeta" x="1026" y="190">外接模块（杜邦线）· GPIO 软件 I2C</text>
  <text class="pin" x="1026" y="212">SCL  PTA29　　SDA  PTA28</text>
  <text class="pinsm" x="1026" y="231">125 Hz 采样 · DLPF≈20 Hz · ±2 g / ±250 °/s · INT 未接</text>
  <path class="bus cI2C" d="M900 212 H1010"/>

  <!-- MAX30102 -->
  <rect class="blk" x="1010" y="278" width="430" height="142" rx="6"/>
  <text class="btitle" x="1026" y="300">MAX30102　心率 / 血氧　0x57</text>
  <text class="bmeta" x="1026" y="318">外接模块 · GPIO 软件 I2C · PART_ID 应读回 0x15</text>
  <text class="pin" x="1026" y="340">SCL  PTE10　　SDA  PTE11</text>
  <text class="pin" x="1026" y="359">INT  PTA10（输入，轮询方式读取）</text>
  <text class="amber" x="1026" y="378">LED 驱动  PTA7　⚠ 固件同时声明 GPIO 与 FTM0_CH4</text>
  <text class="pinsm" x="1026" y="397">GPIO 初始化在后，覆盖了 PWM ⇒ 硬件上只有一条网络</text>
  <text class="pinsm" x="1026" y="413">INTR_ENABLE_1 = 0xC0（PPG_RDY + ALC_OVF）</text>
  <path class="bus cI2C" d="M900 340 H1010"/>
  <path class="w cGPIO" d="M900 365 H975 V359 H1010"/>
  <path class="w cGPIO" d="M975 365 V378 H1010"/>

  <!-- OLED -->
  <rect class="blk" x="1010" y="444" width="430" height="104" rx="6"/>
  <text class="btitle" x="1026" y="466">SSD1306 OLED　128 × 64　0x3C</text>
  <text class="bmeta" x="1026" y="484">外接模块 · GPIO 软件 I2C（控制字 0x00 命令 / 0x40 数据）</text>
  <text class="pin" x="1026" y="506">SCL  PTE26　　SDA  PTE28</text>
  <text class="pinsm" x="1026" y="525">dev/src/oled.c 的 SPI 版 OLED 为死代码（与按键引脚冲突）</text>
  <path class="bus cI2C" d="M900 506 H1010"/>

  <!-- buzzer -->
  <rect class="blk" x="1010" y="572" width="430" height="86" rx="6"/>
  <text class="btitle" x="1026" y="594">蜂鸣器</text>
  <text class="pin" x="1026" y="616">PTE7　纯 GPIO 高低电平翻转，无 PWM</text>
  <text class="pinsm" x="1026" y="635">⇒ 必须是有源（自激）蜂鸣器，或外加振荡 / 驱动级</text>
  <text class="pinsm" x="1026" y="651">PTE7 复用为 FTM3_CH2，但 FTM3 从未初始化</text>
  <path class="w cGPIO" d="M900 616 H1010"/>

  <!-- keys -->
  <rect class="blk" x="1010" y="682" width="430" height="104" rx="6"/>
  <text class="btitle" x="1026" y="704">按键 × 4　+　五向摇杆</text>
  <text class="pin" x="1026" y="726">KEY0-3　PTB21 · PTB22 · PTB23 · PTB20</text>
  <text class="pin" x="1026" y="745">摇杆　上 PTA27　下 PTA26　左 PTA25　右 PTA24　确认 PTA4</text>
  <text class="amber" x="1026" y="764">低电平有效，固件未开内部上拉 ⇒ 需外部上拉；PTA4 = NMI</text>
  <path class="bus cGPIO" d="M900 726 H1010"/>
  <path class="w cGPIO" d="M900 745 H965 V726"/>

  <!-- LEDs -->
  <rect class="blk" x="1010" y="810" width="430" height="76" rx="6"/>
  <text class="btitle" x="1026" y="832">LED × 4（LD3-LD6，低电平点亮）</text>
  <text class="pin" x="1026" y="854">PTB7 · PTB6 · PTB5 · PTB4</text>
  <text class="pinsm" x="1026" y="873">颜色与限流电阻未知</text>
  <path class="bus cGPIO" d="M900 845 H1010"/>

  <!-- misc -->
  <rect class="blk" x="1010" y="910" width="430" height="112" rx="6"/>
  <text class="btitle" x="1026" y="932">串口 · 硬件 I2C · 模拟输入</text>
  <text class="pin" x="1026" y="954">UART4　RX PTC14 · TX PTC15　115200 8N1（遥测）</text>
  <text class="pin" x="1026" y="973">ADC0_DP0 / ADC0_DM0　专用模拟脚，12-bit，100 Hz</text>
  <text class="pin" x="1026" y="992">I2C0（硬件）SCL PTE24 · SDA PTE25　400 kHz</text>
  <text class="pinsm" x="1026" y="1011">I2C0 已初始化但应用层无调用（板载 24C02 / CS43L22）</text>
  <path class="w cGPIO" d="M900 954 H1010"/>
  <path class="w cAN" d="M900 973 H1010"/>
  <path class="w cI2C" d="M900 992 H985 V973"/>

  <!-- legend -->
  <line x1="60" y1="1044" x2="1440" y2="1044" stroke="#e2e8f0" stroke-width="1"/>
  <path class="bus cPAR" d="M62 1064 H92"/><text class="lg" x="98" y="1068">FlexBus 并口</text>
  <path class="bus cSPI" d="M196 1064 H226"/><text class="lg" x="232" y="1068">SPI2</text>
  <path class="bus cI2C" d="M284 1064 H314"/><text class="lg" x="320" y="1068">I2C（含三条软件 I2C）</text>
  <path class="bus cGPIO" d="M474 1064 H504"/><text class="lg" x="510" y="1068">GPIO</text>
  <path class="w cAN" d="M566 1064 H596"/><text class="lg" x="602" y="1068">模拟 / 时钟</text>
  <text class="foot" x="1440" y="1068" text-anchor="end">未画出：SDHC (PTE0-5)、USB CDC、CAN、DAC、I2S、PDB、LPTMR —— 驱动存在但固件从未初始化</text>
</svg>
